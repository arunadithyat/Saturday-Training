<body>

    <script>
// ============================================================
// Farmgenie POS — Offline Data Layer (IndexedDB)
// ============================================================
// This module wraps IndexedDB for caching all POS data locally.
// It intercepts your existing API calls and serves cached data
// when offline, and syncs pending invoices when back online.
// ============================================================

const OfflinePOS = (function () {
  const DB_NAME    = 'FarmgeniePOS_Offline';
  const DB_VERSION = 3;

  const STORES = {
    PRODUCTS:          'products',
    CUSTOMERS:         'customers',
    CASHIERS:          'cashiers',
    STOCK:             'stock',
    ITEM_PRICES:       'item_prices',
    PRICING_RULES:     'pricing_rules',
    PENDING_INVOICES:  'pending_invoices',
    CART_STATE:        'cart_state',
    META:              'meta',
  };

  let db = null;
  let isOnline = navigator.onLine;
  let syncInProgress = false;
  let onlineListeners = [];
  let offlineListeners = [];

  async function init() {
    db = await openDatabase();
    setupNetworkListeners();
    registerServiceWorker();
    listenForSWMessages();
    console.log('[OfflinePOS] Initialized. Online:', isOnline);
    return db;
  }

  function openDatabase() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, DB_VERSION);

      request.onupgradeneeded = (event) => {
        const database = event.target.result;

        if (!database.objectStoreNames.contains(STORES.PRODUCTS))
          database.createObjectStore(STORES.PRODUCTS, { keyPath: 'id' });
        if (!database.objectStoreNames.contains(STORES.CUSTOMERS))
          database.createObjectStore(STORES.CUSTOMERS, { keyPath: 'customerId' });
        if (!database.objectStoreNames.contains(STORES.CASHIERS))
          database.createObjectStore(STORES.CASHIERS, { keyPath: 'id' });
        if (!database.objectStoreNames.contains(STORES.STOCK))
          database.createObjectStore(STORES.STOCK, { keyPath: 'item_code' });
        if (!database.objectStoreNames.contains(STORES.ITEM_PRICES))
          database.createObjectStore(STORES.ITEM_PRICES, { keyPath: 'key' });
        if (!database.objectStoreNames.contains(STORES.PRICING_RULES))
          database.createObjectStore(STORES.PRICING_RULES, { keyPath: 'name' });
        if (!database.objectStoreNames.contains(STORES.PENDING_INVOICES))
          database.createObjectStore(STORES.PENDING_INVOICES, { keyPath: 'id' });
        if (!database.objectStoreNames.contains(STORES.CART_STATE))
          database.createObjectStore(STORES.CART_STATE, { keyPath: 'key' });
        if (!database.objectStoreNames.contains(STORES.META))
          database.createObjectStore(STORES.META, { keyPath: 'key' });

        console.log('[OfflinePOS] Database schema created/upgraded');
      };

      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  async function registerServiceWorker() {
    if (!('serviceWorker' in navigator)) return;
    try {
      const registration = await navigator.serviceWorker.register('/files/sw.js', { scope: '/' });
      console.log('[OfflinePOS] Service Worker registered:', registration.scope);
      setInterval(() => registration.update(), 60 * 60 * 1000);
    } catch (err) {
      console.warn('[OfflinePOS] SW registration failed:', err);
    }
  }

  function listenForSWMessages() {
    if (!('serviceWorker' in navigator)) return;
    navigator.serviceWorker.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'INVOICE_SYNCED') {
        removePendingInvoice(event.data.key);
        if (typeof showNotification === 'function') {
          showNotification(`Offline invoice synced: ${event.data.key}`, 'success');
        }
      }
    });
  }

  function setupNetworkListeners() {
    window.addEventListener('online', () => {
      isOnline = true;
      updateOfflineIndicator(false);
      offlineListeners.forEach((fn) => fn(false));
      syncPendingInvoices();
    });

    window.addEventListener('offline', () => {
      isOnline = false;
      updateOfflineIndicator(true);
      offlineListeners.forEach((fn) => fn(true));
    });
  }

  function updateOfflineIndicator(offline) {
    const el = document.getElementById('connection-status');
    if (!el) return;

    if (offline) {
      el.className = 'connection-status disconnected';
      el.querySelector('span').textContent = 'Offline Mode';
      el.style.background = 'rgba(255,143,0,0.15)';
      el.style.color = '#E65100';
    } else {
      el.className = 'connection-status connected';
      el.querySelector('span').textContent = 'Connected';
      el.style.background = '';
      el.style.color = '';
    }

    showOfflineBanner(offline);
  }

  function showOfflineBanner(show) {
    let banner = document.getElementById('offline-banner');
    if (show && !banner) {
      banner = document.createElement('div');
      banner.id = 'offline-banner';
      banner.style.cssText = `
        position: fixed; top: 0; left: 0; right: 0; z-index: 99999;
        background: linear-gradient(90deg, #E65100, #FF8F00);
        color: white; text-align: center; padding: 6px 12px;
        font-size: 13px; font-weight: 600; font-family: inherit;
        display: flex; align-items: center; justify-content: center; gap: 8px;
        box-shadow: 0 2px 8px rgba(230,81,0,0.3);
      `;
      banner.innerHTML = `
        <i class="fas fa-wifi-slash" style="font-size:14px;"></i>
        <span>Offline Mode — Data served from local cache. Invoices will sync when online.</span>
        <span id="pending-count-badge" style="background:rgba(255,255,255,0.25); padding:2px 8px;border-radius:10px;font-size:11px;display:none;">0 pending</span>
      `;
      document.body.prepend(banner);
      document.body.style.paddingTop = '36px';
    } else if (!show && banner) {
      banner.remove();
      document.body.style.paddingTop = '';
    }

    if (show) updatePendingBadge();
  }

  async function updatePendingBadge() {
    const count = await getPendingInvoiceCount();
    const badge = document.getElementById('pending-count-badge');
    if (!badge) return;
    if (count > 0) {
      badge.textContent = `${count} pending`;
      badge.style.display = 'inline';
    } else {
      badge.style.display = 'none';
    }
  }

  function putItem(storeName, item) {
    return new Promise((resolve, reject) => {
      if (!db) return reject(new Error('DB not initialized'));
      const tx = db.transaction(storeName, 'readwrite');
      const req = tx.objectStore(storeName).put(item);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  function putItems(storeName, items) {
    return new Promise((resolve, reject) => {
      if (!db) return reject(new Error('DB not initialized'));
      const tx = db.transaction(storeName, 'readwrite');
      const store = tx.objectStore(storeName);
      items.forEach((item) => store.put(item));
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  function getItem(storeName, key) {
    return new Promise((resolve, reject) => {
      if (!db) return reject(new Error('DB not initialized'));
      const tx = db.transaction(storeName, 'readonly');
      const req = tx.objectStore(storeName).get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }

  function getAllItems(storeName) {
    return new Promise((resolve, reject) => {
      if (!db) return reject(new Error('DB not initialized'));
      const tx = db.transaction(storeName, 'readonly');
      const req = tx.objectStore(storeName).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  }

  function clearStore(storeName) {
    return new Promise((resolve, reject) => {
      if (!db) return reject(new Error('DB not initialized'));
      const tx = db.transaction(storeName, 'readwrite');
      tx.objectStore(storeName).clear();
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  function deleteItem(storeName, key) {
    return new Promise((resolve, reject) => {
      if (!db) return reject(new Error('DB not initialized'));
      const tx = db.transaction(storeName, 'readwrite');
      tx.objectStore(storeName).delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function cacheProducts(productsList) {
    await clearStore(STORES.PRODUCTS);
    await putItems(STORES.PRODUCTS, productsList);
    await putItem(STORES.META, { key: 'products_cached_at', timestamp: Date.now(), count: productsList.length });
  }

  async function getCachedProducts() { return getAllItems(STORES.PRODUCTS); }

  async function cacheCustomers(customersList) {
    await clearStore(STORES.CUSTOMERS);
    await putItems(STORES.CUSTOMERS, customersList);
    await putItem(STORES.META, { key: 'customers_cached_at', timestamp: Date.now(), count: customersList.length });
  }

  async function getCachedCustomers() { return getAllItems(STORES.CUSTOMERS); }

  async function cacheCashiers(cashiersList) {
    await clearStore(STORES.CASHIERS);
    await putItems(STORES.CASHIERS, cashiersList);
    await putItem(STORES.META, { key: 'cashiers_cached_at', timestamp: Date.now(), count: cashiersList.length });
  }

  async function getCachedCashiers() { return getAllItems(STORES.CASHIERS); }

  async function cacheStock(stockMap) {
    await clearStore(STORES.STOCK);
    const items = Object.entries(stockMap).map(([code, qty]) => ({ item_code: code, actual_qty: qty }));
    await putItems(STORES.STOCK, items);
  }

  async function getCachedStock() {
    const items = await getAllItems(STORES.STOCK);
    const map = {};
    items.forEach((i) => { map[i.item_code] = i.actual_qty; });
    return map;
  }

  async function cacheItemPrices(priceList, prices) {
    const items = prices.map((p) => ({
      key: `${p.item_code}__${priceList}`,
      item_code: p.item_code,
      price_list: priceList,
      price_list_rate: p.price_list_rate,
    }));
    await putItems(STORES.ITEM_PRICES, items);
  }

  async function getCachedItemPrices(priceList) {
    const all = await getAllItems(STORES.ITEM_PRICES);
    return all.filter((p) => p.price_list === priceList);
  }

  async function saveCartState(state) {
    await putItem(STORES.CART_STATE, { key: 'current', ...state, saved_at: Date.now() });
  }

  async function getCartState() { return getItem(STORES.CART_STATE, 'current'); }
  async function clearCartState() { return deleteItem(STORES.CART_STATE, 'current'); }

  async function queueInvoice(invoiceDoc, printPayload) {
    const pendingInvoice = {
      id: 'OFFLINE-' + Date.now() + '-' + Math.random().toString(36).substr(2, 6),
      doc: invoiceDoc,
      printPayload,
      created_at: Date.now(),
      status: 'pending',
      retryCount: 0,
      url: '/api/method/frappe.client.insert',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/json',
        'X-Requested-With': 'XMLHttpRequest',
      },
      body: JSON.stringify({ doc: invoiceDoc }),
    };

    await putItem(STORES.PENDING_INVOICES, pendingInvoice);
    updatePendingBadge();

    if ('serviceWorker' in navigator && 'SyncManager' in window) {
      const reg = await navigator.serviceWorker.ready;
      try { await reg.sync.register('sync-pending-invoices'); } catch (e) {
        console.warn('[OfflinePOS] Background Sync not available:', e);
      }
    }

    return pendingInvoice.id;
  }

  async function getPendingInvoices() { return getAllItems(STORES.PENDING_INVOICES); }
  async function getPendingInvoiceCount() {
    const all = await getAllItems(STORES.PENDING_INVOICES);
    return all.filter((i) => i.status === 'pending').length;
  }
  async function removePendingInvoice(id) {
    await deleteItem(STORES.PENDING_INVOICES, id);
    updatePendingBadge();
  }

  async function syncPendingInvoices() {
    if (syncInProgress || !isOnline) return;
    syncInProgress = true;

    const pending = await getPendingInvoices();
    const toSync = pending.filter((i) => i.status === 'pending' || i.status === 'failed');

    for (const invoice of toSync) {
      try {
        invoice.status = 'syncing';
        await putItem(STORES.PENDING_INVOICES, invoice);

        let result;
        if (typeof frappe !== 'undefined') {
          const insertRes = await frappe.call({ method: 'frappe.client.insert', args: { doc: invoice.doc } });
          if (!insertRes.message) throw new Error('No insert response');
          const name = insertRes.message.name;
          const getRes = await frappe.call({ method: 'frappe.client.get', args: { doctype: 'Sales Invoice', name } });
          if (!getRes.message) throw new Error('Could not fetch for submit');
          await frappe.call({ method: 'frappe.client.submit', args: { doc: getRes.message } });
          result = { name, success: true };
        } else {
          const response = await fetch('https://erp.farmgenie.store/api/method/frappe.client.insert', {
            method: 'POST', headers: invoice.headers, body: invoice.body,
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          result = await response.json();
        }

        invoice.status = 'synced';
        invoice.synced_at = Date.now();
        invoice.result = result;
        await putItem(STORES.PENDING_INVOICES, invoice);
        setTimeout(() => removePendingInvoice(invoice.id), 5000);

        if (typeof showNotification === 'function') {
          showNotification(`Offline invoice synced: ${result.name || invoice.id}`, 'success');
        }
      } catch (err) {
        invoice.status = 'failed';
        invoice.retryCount = (invoice.retryCount || 0) + 1;
        invoice.lastError = err.message;
        await putItem(STORES.PENDING_INVOICES, invoice);

        if (typeof showNotification === 'function') {
          showNotification(`Invoice sync failed (retry ${invoice.retryCount}): ${err.message}`, 'error');
        }
      }
    }

    syncInProgress = false;
    updatePendingBadge();
    if (typeof fetchTodaysBills === 'function' && toSync.length > 0) {
      setTimeout(() => fetchTodaysBills(), 2000);
    }
  }

  async function fetchWithOffline(url, options = {}, retries = 3) {
    if (navigator.onLine) {
      try {
        const defaultOptions = {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json',
            'Cache-Control': 'no-cache',
            'X-Requested-With': 'XMLHttpRequest',
          },
          signal: AbortSignal.timeout(15000),
        };
        const finalOptions = { ...defaultOptions, ...options };
        const response = await fetch(url, finalOptions);
        if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
        const data = await response.json();
        autoCacheAPIResponse(url, data);
        return data;
      } catch (error) {
        if (retries > 0 && (error.name === 'TypeError' || error.name === 'AbortError')) {
          await new Promise((r) => setTimeout(r, 1000));
          return fetchWithOffline(url, options, retries - 1);
        }
      }
    }

    return serveFromCache(url);
  }

  function autoCacheAPIResponse(url, data) {
    try {
      if (url.includes('/api/method/pro') && data.success && data.data) {
        const cashiersList = data.data.map((c) => ({
          id: c.name || c.__newname || 'Unknown',
          name: c.__newname || 'Unknown Cashier',
          warehouse: c.warehouse || 'Default Warehouse',
          company: c.company || 'Farmgenie Freshcart Private Limited',
          allow_user_to_edit_rate: c.allow_user_to_edit_rate || 0,
          is_system_manager: c.is_system_manager || 0,
        }));
        cacheCashiers(cashiersList);
      }

      if (url.includes('/api/method/api') && data.success && data.data) {
        const customersList = data.data.map((c) => ({
          id: c.customer_name || c.name || 'Unknown',
          name: c.customer_name || c.name || 'Unknown Customer',
          customerId: c.name || c.customer_name || 'Unknown',
          group: c.customer_type || 'Regular',
          gstCategory: c.gst_category || 'Unregistered',
          mobile: c.mobile_no || c.phone || c.mobile || '',
        }));
        cacheCustomers(customersList);
      }

      if (url.includes('/api/method/bin') && data.success && data.data) {
        const stockMap = {};
        data.data.forEach((bin) => {
          if (bin.item_code && bin.actual_qty) stockMap[bin.item_code] = parseFloat(bin.actual_qty);
        });
        cacheStock(stockMap);
      }

      if (url.includes('/api/resource/Item%20Price') && data.data) {
        const match = url.match(/price_list.*?=.*?["']([^"']+)/);
        const priceList = match ? decodeURIComponent(match[1]) : 'Standard Selling';
        cacheItemPrices(priceList, data.data);
      }
    } catch (e) {
      console.warn('[OfflinePOS] Auto-cache error:', e);
    }
  }

  async function serveFromCache(url) {
    if (url.includes('/api/method/pro')) {
      const cached = await getCachedCashiers();
      if (cached.length) {
        return { success: true, data: cached.map((c) => ({
          name: c.id, __newname: c.name, warehouse: c.warehouse, company: c.company,
          allow_user_to_edit_rate: c.allow_user_to_edit_rate, is_system_manager: c.is_system_manager,
        })), _offline: true };
      }
    }

    if (url.includes('/api/method/api')) {
      const cached = await getCachedCustomers();
      if (cached.length) {
        return { success: true, data: cached.map((c) => ({
          name: c.customerId, customer_name: c.name, customer_type: c.group,
          gst_category: c.gstCategory, mobile_no: c.mobile,
        })), _offline: true };
      }
    }

    if (url.includes('/api/method/bin')) {
      const stockMap = await getCachedStock();
      return {
        success: true,
        data: Object.entries(stockMap).map(([item_code, actual_qty]) => ({ item_code, actual_qty })),
        _offline: true,
      };
    }

    if (url.includes('/api/resource/Item%20Price')) {
      const match = url.match(/price_list.*?=.*?["']([^"']+)/);
      const priceList = match ? decodeURIComponent(match[1]) : 'Standard Selling';
      const cached = await getCachedItemPrices(priceList);
      if (cached.length) {
        return { data: cached.map((p) => ({ item_code: p.item_code, price_list_rate: p.price_list_rate })), _offline: true };
      }
    }

    if (url.includes('/api/resource/Item') && !url.includes('Item%20Price')) {
      const products = await getCachedProducts();
      if (products.length) {
        return { data: products.map((p) => ({
          name: p.id, item_name: p.name, item_group: p.category, stock_uom: p.unit,
          image: p.image, custom_mrp_price: p.custom_mrp_price,
        })), _offline: true };
      }
    }

    return {
      success: false,
      data: [],
      _offline: true,
      message: 'Offline — no cached data available for this request',
    };
  }

  async function getCacheStatus() {
    const status = {};
    for (const [label, storeName] of Object.entries(STORES)) {
      if (storeName === 'meta') continue;
      try {
        const items = await getAllItems(storeName);
        status[label] = items.length;
      } catch {
        status[label] = 0;
      }
    }

    try {
      const productsMeta = await getItem(STORES.META, 'products_cached_at');
      const customersMeta = await getItem(STORES.META, 'customers_cached_at');
      const cashiersMeta = await getItem(STORES.META, 'cashiers_cached_at');
      status.products_cached_at = productsMeta ? new Date(productsMeta.timestamp).toLocaleString() : 'Never';
      status.customers_cached_at = customersMeta ? new Date(customersMeta.timestamp).toLocaleString() : 'Never';
      status.cashiers_cached_at = cashiersMeta ? new Date(cashiersMeta.timestamp).toLocaleString() : 'Never';
    } catch {}

    status.isOnline = isOnline;
    return status;
  }

  async function forceCacheRefresh() {
    if (!navigator.onLine) return false;
    try {
      await fetchWithOffline('https://erp.farmgenie.store/api/method/pro');
      await fetchWithOffline('https://erp.farmgenie.store/api/method/api');
      if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage({ type: 'FORCE_CACHE_UPDATE' });
      }
      return true;
    } catch {
      return false;
    }
  }

  return {
    init,
    isOnline: () => isOnline,
    cacheProducts,
    getCachedProducts,
    cacheCustomers,
    getCachedCustomers,
    cacheCashiers,
    getCachedCashiers,
    cacheStock,
    getCachedStock,
    cacheItemPrices,
    getCachedItemPrices,
    saveCartState,
    getCartState,
    clearCartState,
    queueInvoice,
    getPendingInvoices,
    getPendingInvoiceCount,
    removePendingInvoice,
    syncPendingInvoices,
    fetchWithOffline,
    getCacheStatus,
    forceCacheRefresh,
    onOnline: (fn) => onlineListeners.push(fn),
    onOffline: (fn) => offlineListeners.push(fn),
  };
})();
    </script>
</body>
</html>
